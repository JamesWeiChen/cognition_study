{{ block title }}
第二階段：選舉情境模擬
{{ endblock }}

{{ block content }}
<div class="card bg-light m-3">
    <div class="card-body">
        <p>在接下來的實驗階段中，您將參與兩場<strong>「模擬選舉」</strong>。系統將為您呈現一個虛擬城市（T市）和一所虛擬學校 (T校) 的市長與學生會會長選舉情境。</p>

        <ul>
            <li>這是兩場虛擬的選舉，所有的情境與候選人皆為模擬設定。</li>
            <li>在本測驗中，您無需具備專業的政策知識，也無需考量現實世界中的法規限制。</li>
            <li>請您在閱讀完候選人的資訊後，依照您最真實的個人偏好做出選擇即可。</li>
        </ul>

        <p>如果您已經了解上述說明並準備好進入模擬情境，請點擊下方按鈕開始測驗。</p>
    </div>
</div>

<br>
<div style="text-align: center;">
    <button class="otree-btn-next btn btn-primary">我已了解，進入模擬選舉</button>
</div>
