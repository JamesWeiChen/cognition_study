{{ block title }}
學生會長候選人政見發表
{{ endblock }}

{{ block content }}
<p>*本段實驗文本將與小測驗相關</p>
<p>以下是兩位候選人的核心政見。請仔細比較他們主張的學分上限差異：</p>

<div style="display: flex; justify-content: space-between; gap: 20px;">
    <div style="flex: 1; border: 1px solid #ccc; padding: 20px; border-radius: 8px; text-align: center;">
        <img src="{% static 'candidate_a.png' %}" alt="候選人A照片" style="width: 150px; height: 150px; object-fit: contain; margin: 0 auto; display: block;">
        <h4 style="margin-top: 15px;">候選人 A</h4>
        <div style="background-color: #FFF0F5; padding: 15px; border-radius: 8px; margin-top: 15px;">
            <p style="margin: 0; font-size: 1.1rem; color: #555;">【減輕課業焦慮，鼓勵跨域探索】</p>
            <p style="margin: 10px 0 0 0; font-size: 1.1rem;">承諾將探索學分上限調整為：</p>
            <p style="margin: 5px 0 0 0; font-size: 2rem; font-weight: bold; color: #D87093;">{{ 候選人A_學分 }} 學分</p>
        </div>
    </div>

    <div style="flex: 1; border: 1px solid #ccc; padding: 20px; border-radius: 8px; text-align: center;">
        <img src="{% static 'candidate_b.png' %}" alt="候選人B照片" style="width: 150px; height: 150px; object-fit: contain; margin: 0 auto; display: block;">
        <h4 style="margin-top: 15px;">候選人 B</h4>
        <div style="background-color: #FFF0F5; padding: 15px; border-radius: 8px; margin-top: 15px;">
            <p style="margin: 0; font-size: 1.1rem; color: #555;">【減輕課業焦慮，鼓勵跨域探索】</p>
            <p style="margin: 10px 0 0 0; font-size: 1.1rem;">承諾將探索學分上限調整為：</p>
            <p style="margin: 5px 0 0 0; font-size: 2rem; font-weight: bold; color: #D87093;">{{ 候選人B_學分 }} 學分</p>
        </div>
    </div>
</div>

<br><br>
<div style="text-align: center;">
    <button class="otree-btn-next btn btn-primary">我已經了解他們的政見，準備前往測驗</button>
</div>

<style>
body { font-size: 1.15rem !important; line-height: 1.7 !important; color: #333333 !important; }
.btn { font-size: 1.15rem !important; padding: 10px 20px !important; }
h4, h5, label { line-height: 1.5 !important; margin-bottom: 10px !important; font-size: 1.15rem !important; }
</style>

<!-- 🌟 計時小抄的隱藏框框 -->
<input type="hidden" name="看政見時間2" id="page_timer">
<script>
    let startTime = Date.now(); 
    document.getElementById('form').addEventListener('submit', function() {
        let endTime = Date.now(); 
        let timeSpent = (endTime - startTime) / 1000; 
        document.getElementById('page_timer').value = timeSpent; 
    });
</script>
{{ endblock }}
