<script>
    document.addEventListener("DOMContentLoaded",function() {
        let otherFieldContainer = document.querySelector('input[name="政治傾向_其他"]').closest('.mb-3');
        if (!otherFieldContainer) {
            otherFieldContainer = document.querySelector('input[name="政治傾向_其他"]').parentElement;
        }
        otherFieldContainer.style.display = 'none';

        let gradeContainer = document.querySelector('input[name="年級"]').closest('.mb-3');
        if (!gradeContainer) gradeContainer = document.querySelector('input[name="年級"]').parentElement;
        gradeContainer.style.display = 'none';

        let collegeContainer = document.querySelector('input[name="學院"]').closest('.mb-3');
        if (!collegeContainer) collegeContainer = document.querySelector('input[name="學院"]').parentElement;
        collegeContainer.style.display = 'none';

        let deptContainer = document.querySelector('input[name="科系"]').closest('.mb-3');
        if (!deptContainer) deptContainer = document.querySelector('input[name="科系"]').parentElement;
        deptContainer.style.display = 'none';

        let radiosOther = document.querySelectorAll('input[name="政治傾向"]');
        radiosOther.forEach(function(radio) {
            radio.addEventListener('change', function() {
                if (this.value === '其他') {
                    otherFieldContainer.style.display = 'block';
                } else {
                    otherFieldContainer.style.display = 'none';
                    document.querySelector('input[name="政治傾向_其他"]').value = '';
                }
            });
        });

        let radiosStudent = document.querySelectorAll('input[name="是否為學生"]');
        radiosStudent.forEach(function(radio) {
            radio.addEventListener('change', function() {
                if (this.value === '是') {
                    gradeContainer.style.display = 'block';
                    collegeContainer.style.display = 'block';
                    deptContainer.style.display = 'block';
                } else {
                    gradeContainer.style.display = 'none';
                    collegeContainer.style.display = 'none';
                    deptContainer.style.display = 'none';
                    
                    let gradeInputs = document.querySelectorAll('input[name="年級"]');
                    gradeInputs.forEach(i => i.checked = false);
                    document.querySelector('input[name="學院"]').value = '';
                    document.querySelector('input[name="科系"]').value = '';
                }
            });
        });
    });
</script>
